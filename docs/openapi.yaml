openapi: 3.1.0
info:
  title: TraceFlow API
  version: 0.1.0
  description: |
    Read API for the TraceFlow dashboard. All data is computed from spans
    ingested by the collector (`POST /v1/traces` on port 4318, documented at
    the end of this file for reference).

    Errors always use the shape `{ "error": { "code": string, "message": string, "details"?: any } }`.
    Timestamps are ISO-8601 strings; raw OpenTelemetry nanosecond timestamps
    are decimal strings because they exceed JavaScript's safe integer range.
servers:
  - url: http://127.0.0.1:4400
paths:
  /api/health:
    get:
      summary: Liveness and dependency status
      responses:
        '200':
          {
            description: Healthy,
            content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } },
          }
        '503':
          {
            description: Database unreachable,
            content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } },
          }
  /api/meta:
    get:
      summary: Instance information (public-demo notice)
      responses:
        '200': { description: 'demo is null unless this is a public demo instance' }
  /api/overview:
    get:
      summary: Dashboard KPIs for a time window
      parameters: [{ $ref: '#/components/parameters/window' }]
      responses:
        '200':
          {
            description: Overview,
            content: { application/json: { schema: { $ref: '#/components/schemas/Overview' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/traces:
    get:
      summary: Search traces (paginated)
      parameters:
        - {
            name: q,
            in: query,
            schema: { type: string, maxLength: 200 },
            description: 'Trace id prefix (hex) or text matched against root operation / service',
          }
        - {
            name: service,
            in: query,
            schema: { type: string },
            description: Only traces that include a span from this service,
          }
        - { name: status, in: query, schema: { type: string, enum: [ok, error, all] } }
        - { name: minDurationMs, in: query, schema: { type: number, minimum: 0 } }
        - { name: maxDurationMs, in: query, schema: { type: number, minimum: 0 } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - {
            name: sort,
            in: query,
            schema: { type: string, enum: [startTime, duration, spanCount], default: startTime },
          }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: desc } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - {
            name: pageSize,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        '200':
          description: One page of trace summaries
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, total]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TraceSummary' } }
                  page: { type: integer }
                  pageSize: { type: integer }
                  total: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/traces/{traceId}:
    get:
      summary: A trace with all of its spans
      parameters:
        - {
            name: traceId,
            in: path,
            required: true,
            schema: { type: string, pattern: '^[0-9a-f]{32}$' },
          }
      responses:
        '200':
          {
            description: Trace detail,
            content: { application/json: { schema: { $ref: '#/components/schemas/TraceDetail' } } },
          }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/services:
    get:
      summary: Services with telemetry in the window and their RED metrics
      parameters: [{ $ref: '#/components/parameters/window' }]
      responses:
        '200':
          description: Services
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string }
                  items: { type: array, items: { $ref: '#/components/schemas/ServiceSummary' } }
  /api/services/{name}:
    get:
      summary: Service analytics (volume, latency histogram, operations, dependencies, recent traces)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/window' }
      responses:
        '200':
          {
            description: Service detail,
            content: { application/json: { schema: { type: object } } },
          }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/dependencies:
    get:
      summary: Service dependency graph derived from parent/child span links
      parameters: [{ $ref: '#/components/parameters/window' }]
      responses:
        '200':
          description: Graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  window: { type: string }
                  nodes: { type: array, items: { $ref: '#/components/schemas/DependencyNode' } }
                  edges: { type: array, items: { $ref: '#/components/schemas/DependencyEdge' } }
  /api/stream:
    get:
      summary: Server-Sent Events stream of newly ingested traces
      description: |
        Events: `ready` (on connect), `traces` (`{ traces: TraceSummary[] }`),
        `resync` (refetch everything; notifications may have been missed).
        A `: ping` comment is sent every 15 seconds.
      responses:
        '200':
          {
            description: Event stream,
            content: { text/event-stream: { schema: { type: string } } },
          }
        '503': { description: Too many live connections }
  /api/openapi.json:
    get:
      summary: This document as JSON
      responses:
        '200': { description: OpenAPI document }
components:
  parameters:
    window:
      name: window
      in: query
      schema: { type: string, enum: [15m, 1h, 6h, 24h, 7d], default: 1h }
  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [up, down] }
        live: { type: string, enum: [listening, disconnected] }
    Latency:
      type: object
      properties:
        p50: { type: [number, 'null'] }
        p95: { type: [number, 'null'] }
        p99: { type: [number, 'null'] }
    TraceSummary:
      type: object
      properties:
        traceId: { type: string }
        rootService: { type: [string, 'null'] }
        rootOperation: { type: [string, 'null'] }
        rootSpanId: { type: [string, 'null'] }
        startTime: { type: string, format: date-time }
        endTime: { type: string, format: date-time }
        durationMs: { type: number }
        status: { type: string, enum: [ok, error] }
        spanCount: { type: integer }
        errorCount: { type: integer }
        services: { type: array, items: { type: string } }
        hasRoot:
          { type: boolean, description: 'False until the span without a parent has been received' }
        orphanCount: { type: integer, description: 'Spans whose parent has not been received' }
        updatedAt: { type: string, format: date-time }
    Span:
      type: object
      properties:
        traceId: { type: string }
        spanId: { type: string }
        parentSpanId: { type: [string, 'null'] }
        service: { type: string }
        operationName: { type: string }
        kind: { type: string, enum: [unspecified, internal, server, client, producer, consumer] }
        startTimeUnixNano: { type: string }
        endTimeUnixNano: { type: string }
        offsetMs: { type: number, description: Milliseconds from trace start }
        durationMs: { type: number }
        statusCode: { type: string, enum: [unset, ok, error] }
        statusMessage: { type: [string, 'null'] }
        attributes: { type: object }
        resourceAttributes: { type: object }
        events: { type: array, items: { type: object } }
        links: { type: array, items: { type: object } }
        scopeName: { type: [string, 'null'] }
    TraceDetail:
      type: object
      properties:
        trace: { $ref: '#/components/schemas/TraceSummary' }
        spans: { type: array, items: { $ref: '#/components/schemas/Span' } }
        truncated: { type: boolean }
    ServiceSummary:
      type: object
      properties:
        name: { type: string }
        environment: { type: [string, 'null'] }
        requestCount: { type: integer }
        errorCount: { type: integer }
        errorRate: { type: [number, 'null'] }
        requestRate: { type: number }
        latency: { $ref: '#/components/schemas/Latency' }
        lastSeen: { type: [string, 'null'] }
    Overview:
      type: object
      properties:
        window: { type: string }
        traceCount: { type: integer }
        spanCount: { type: integer }
        errorTraceCount: { type: integer }
        errorRate: { type: [number, 'null'] }
        requestRate: { type: number }
        latency: { $ref: '#/components/schemas/Latency' }
        serviceCount: { type: integer }
        timeseries: { type: array, items: { type: object } }
        slowestServices: { type: array, items: { $ref: '#/components/schemas/ServiceSummary' } }
        recentTraces: { type: array, items: { $ref: '#/components/schemas/TraceSummary' } }
    DependencyNode:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [service, database, messaging] }
        requestCount: { type: integer }
        errorCount: { type: integer }
        errorRate: { type: [number, 'null'] }
        latency: { $ref: '#/components/schemas/Latency' }
    DependencyEdge:
      type: object
      properties:
        source: { type: string }
        target: { type: string }
        targetKind: { type: string, enum: [service, database, messaging] }
        callCount: { type: integer }
        errorCount: { type: integer }
        latency: { $ref: '#/components/schemas/Latency' }
# Collector (separate process, port 4318) — for reference:
#   POST /v1/traces   Content-Type: application/json  (optionally Content-Encoding: gzip)
#     body: OTLP ExportTraceServiceRequest (JSON encoding)
#     200 {} | 200 { partialSuccess: { rejectedSpans, errorMessage } }
#     400 / 413 / 415 { code, message }   503 + Retry-After when storage is unavailable
